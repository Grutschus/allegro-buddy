name: PyPI

# Runs only in the public repo, on the release that release.yml creates there, so
# the sdist holds only the public snapshot and the PyPI provenance names the public
# repo. Uses PyPI Trusted Publishing (no token): the PyPI project trusts
# Grutschus/allegro-buddy, workflow pypi.yml, environment pypi.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Grutschus/allegro-buddy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Separate job so a required reviewer on the pypi environment can download and
  # inspect the dist artifact before approving the upload.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/allegro-buddy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
