name: CI

on:
  push:
    branches: [main, rust]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Draft PRs get no CI; run the checks locally before marking a PR ready.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features test-hooks -- -D warnings
      - run: cargo test --locked
  msrv:
    # The oldest Rust that builds bab (Cargo.toml `rust-version`, README): let-chains need
    # 1.88. --locked proves the pinned dependencies build with it too.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets --features test-hooks
  compat:
    # Differential test against the Python reference goldens (compat/README.md). The binary
    # under test needs the BAB_TEST_* hooks, hence `--features test-hooks`.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --locked --features test-hooks
      - run: uv run --locked --project compat pytest compat -q -n auto
        env:
          BAB_BIN: target/debug/bab
