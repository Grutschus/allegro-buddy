[project]
name = "bab-compat"
version = "0"
description = "Differential test harness: the Python allegro-buddy 2.7 reference vs the Rust bab"
requires-python = "==3.12.*"
# The reference oracle, pinned to the versions of main's uv.lock (allegro-buddy 2.7).
dependencies = [
    "allegro-buddy==2.7",
    "click==8.3.2",
    "rich==15.0.0",
    "rich-click==1.9.9",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "pygments==2.20.0",
    "typing-extensions==4.15.0",
    "pytest==9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_compat.py"]
