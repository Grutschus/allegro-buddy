# Python packaging for PyPI: maturin puts the binaries (`ab`, `allegro-buddy` and the
# aliases `bab`, `better-allegro-buddy`: every [[bin]] in Cargo.toml) into platform wheels
# (`bindings = "bin"`), no Python code. The version comes from Cargo.toml.
# Releasing: CONTRIBUTING.md.
[build-system]
requires = ["maturin>=1.9.2,<2"]  # 1.9.2: PEP 639 `license`/`license-files`
build-backend = "maturin"

[project]
name = "allegro-buddy"
dynamic = ["version"]
description = "A friendly Slurm helper, with presets for the Allegro cluster."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grutschus" }, { name = "Michael Plainer" }]
keywords = ["slurm", "hpc", "cluster", "gpu", "cli", "allegro", "sbatch", "squeue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]

[project.urls]
Source = "https://github.com/Grutschus/allegro-buddy"
Issues = "https://github.com/Grutschus/allegro-buddy/issues"

[tool.maturin]
bindings = "bin"
# The sdist holds only what builds the binary (Cargo.toml `include`): no compat/, bench/,
# tests/, tools/ or .github/.
