[package]
name = "allegro-buddy"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A friendly Slurm helper, with presets for the Allegro cluster."
license = "MIT"
repository = "https://github.com/Grutschus/allegro-buddy"
readme = "README.md"
publish = false
# What a source package (`maturin sdist` for PyPI, `cargo package`) contains: only what
# builds the binary. tests/, bench/, tools/, .github/ stay in the repository.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/presets/*.ini",
    "/src/**/*.rs",
]

# One program under four names; it calls itself by the name it was started as (click's
# prog_name), like the Python package's two console scripts `ab` and `allegro-buddy`.
# `bab` and `better-allegro-buddy` keep installs of the former Rust fork working. Every
# [[bin]] lands in the wheel (maturin `bindings = "bin"`), each a full copy.
[[bin]]
name = "ab"
path = "src/main.rs"

[[bin]]
name = "allegro-buddy"
path = "src/bin/allegro-buddy.rs"

[[bin]]
name = "bab"
path = "src/bin/bab.rs"

[[bin]]
name = "better-allegro-buddy"
path = "src/bin/better-allegro-buddy.rs"

# Kept minimal on purpose (startup time + binary size); justify any addition here.
[dependencies]
# Local wall clock, naive datetimes and strftime (%a/%b/%H:%M) like Python's datetime.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# getgroups/getgrgid_r/getpwuid_r (NSS), isatty, ioctl(TIOCGWINSZ), signals, execvp.
libc = "0.2.191"
# Ports of the Python regexes (GRES parsing, prop lines, Rich markup/highlighter).
regex = "1.13.1"
# Rich's ReprHighlighter regexes need lookbehind (Python `re` semantics).
fancy-regex = { version = "0.20.0", default-features = false, features = ["unicode", "perf"] }
# `scontrol --json` output; untyped Value access only, so no serde derive.
serde_json = "1.0.154"
# serde_json's trait crate (already in the tree): a hand-written visitor parses job records
# without the ~100 keys per job bab never reads (`core::jobs::job_records_json`).
serde_core = "1.0.229"

[features]
# The BAB_TEST_* environment hooks (frozen clock, groups, hostname, interactive stdin) for
# tests/snapshots.rs. Off by default: a normal build never reads these variables.
# `cargo test` turns it on via the dev-dependency below.
test-hooks = []

[dev-dependencies]
# Self-reference so integration tests get an `ab` binary with the test hooks.
allegro-buddy = { path = ".", features = ["test-hooks"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
